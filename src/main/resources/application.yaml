server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: turism
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turism}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Lima
